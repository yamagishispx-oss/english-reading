<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英語音読トレーニング - 伝わる英語を目指そう</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bg-main: #f8fafc;
      --surface: #ffffff;
      --text-main: #0f172a;
      --text-sub: #475569;
      --border-color: #e2e8f0;
      
      --color-perfect: #16a34a;
      --bg-perfect: #dcfce7;
      --color-near: #d97706;
      --bg-near: #fef3c7;
      --color-again: #dc2626;
      --bg-again: #fee2e2;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 20px 16px;
      max-width: 720px;
      margin: 0 auto;
      color: var(--text-main);
      background: var(--bg-main);
      line-height: 1.5;
    }

    .header-card {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #1e3a8a 100%);
      color: #ffffff;
      padding: 22px 20px;
      border-radius: 14px;
      margin-bottom: 18px;
      text-align: center;
      box-shadow: 0 8px 20px -4px rgba(15, 23, 42, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .header-card h1 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.03em;
    }
    .header-card .sub-message {
      font-size: 0.92rem;
      font-weight: 600;
      margin-top: 8px;
      color: #38bdf8;
      letter-spacing: 0.02em;
    }

    .card {
      background: var(--surface);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      margin-bottom: 16px;
    }

    h2 {
      margin-top: 0;
      color: var(--text-main);
      font-size: 1.02rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 8px;
      margin-bottom: 14px;
    }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }
    @media (max-width: 560px) {
      .action-grid {
        grid-template-columns: 1fr;
      }
    }

    .tab-container {
      display: flex;
      background: #e2e8f0;
      padding: 4px;
      border-radius: 10px;
      margin-bottom: 16px;
    }
    .tab-btn {
      flex: 1;
      padding: 9px;
      font-size: 14px;
      font-weight: 700;
      border: none;
      background: transparent;
      color: var(--text-sub);
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: 0 2px 5px rgba(0,0,0,0.08);
    }

    label { font-weight: 600; font-size: 13.5px; color: var(--text-sub); }
    input[type="text"], textarea, select {
      width: 100%;
      padding: 10px;
      font-size: 14.5px;
      box-sizing: border-box;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      margin-top: 6px;
      background: #ffffff;
      color: var(--text-main);
    }
    textarea { height: 95px; font-family: inherit; resize: vertical; }

    button {
      padding: 9px 15px;
      font-size: 13.5px;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      font-weight: 700;
      margin-right: 6px;
      margin-top: 6px;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: #ffffff; }
    .btn-success { background: #16a34a; color: #ffffff; }
    .btn-danger { background: #dc2626; color: #ffffff; }
    .btn-sub { background: #64748b; color: #ffffff; }
    .btn-auto-chunk {
      background: #f1f5f9;
      color: var(--primary-dark);
      border: 1px solid #cbd5e1;
      padding: 4px 10px;
      font-size: 12px;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-auto-chunk:hover { background: #e2e8f0; }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }
    .metric-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
    }
    .metric-label { font-size: 11.5px; font-weight: 700; color: var(--text-sub); }
    .metric-value { font-size: 24px; font-weight: 800; color: var(--primary); margin-top: 2px; }
    .metric-unit { font-size: 12px; font-weight: 600; color: #64748b; }
    .metric-desc { font-size: 11px; font-weight: 600; color: #0284c7; margin-top: 2px; }

    .word {
      display: inline-block;
      padding: 3px 8px;
      margin: 3px;
      border-radius: 5px;
      font-size: 16.5px;
      font-weight: 700;
    }
    .word-perfect { background: var(--bg-perfect); color: var(--color-perfect); border: 1px solid #bbf7d0; }
    .word-near { background: var(--bg-near); color: var(--color-near); border: 1px solid #fde68a; }
    .word-again { background: var(--bg-again); color: var(--color-again); border: 1px solid #fecdd3; }
    .chunk-divider { color: #0284c7; font-weight: 800; margin: 0 4px; font-size: 18px; }

    .weak-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff1f2;
      border: 1px solid #fecdd3;
      padding: 10px 14px;
      border-radius: 8px;
      margin-top: 8px;
    }
    #ocrStatus { font-weight: 600; color: var(--primary); margin-top: 6px; font-size: 13px; }
    .legend { display: flex; gap: 12px; font-size: 11.5px; font-weight: 600; margin-bottom: 10px; }
    .legend-item { display: flex; align-items: center; gap: 4px; }
    .legend-dot { width: 9px; height: 9px; border-radius: 50%; }
  </style>
</head>
<body>

  <!-- アプリタイトルヘッダー -->
  <div class="header-card">
    <h1>英語音読トレーニング</h1>
    <div class="sub-message">〜 相手に「伝わる英語」を目指して練習しよう！ 〜</div>
  </div>

  <!-- 生徒情報入力 -->
  <div class="card" style="background: #f0f9ff; border-color: #bae6fd;">
    <label for="studentId">生徒ID（半角4桁／入力必須）</label>
    <input type="text" id="studentId" placeholder="例: 1459" maxlength="4" oninput="saveStudentId()">
  </div>

  <!-- モード選択 -->
  <div class="tab-container">
    <button id="tabTeacher" class="tab-btn active" onclick="switchMode('teacher')">配信課題</button>
    <button id="tabOriginal" class="tab-btn" onclick="switchMode('original')">オリジナル原稿</button>
  </div>

  <!-- 原稿の用意 -->
  <div class="card">
    <h2>
      <span>原稿の準備</span>
      <button class="btn-auto-chunk" onclick="applyAutoChunking()">🪄 自動チャンク区切り</button>
    </h2>

    <div id="modeTeacherArea">
      <label>練習する課題を選択してください:</label>
      <select id="taskSelect" onchange="onTaskChange()">
        <option value="">読み込み中...</option>
      </select>
    </div>

    <div id="modeOriginalArea" style="display:none;">
      <div style="margin-bottom: 10px;">
        <label>対象の授業名・単元名を選択してください:</label>
        <select id="originalCategorySelect">
          <option value="">読み込み中...</option>
        </select>
      </div>

      <div style="background: #f8fafc; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 10px;">
        <label>画像から文字を読み込む（OCR）:</label><br>
        <input type="file" id="imageInput" accept="image/*" onchange="processImage(this)" style="margin-top:4px;">
        <div id="ocrStatus"></div>
      </div>
    </div>

    <div style="margin-top: 10px;">
      <label>英文の確認・編集（ / で区切り位置を指定可能）:</label>
      <textarea id="sentence" placeholder="選択された英文または入力した英文がここに表示されます..."></textarea>
    </div>
  </div>

  <!-- お手本再生と録音の横並びエリア -->
  <div class="action-grid">
    <!-- 音声再生（再生・停止の2ボタン化） -->
    <div class="card" style="margin-bottom: 0;">
      <h2>音声再生（お手本）</h2>
      <div style="margin-bottom: 8px;">
        <label>速度: </label>
        <select id="speechRate" style="width: auto; display: inline-block; padding: 4px 8px;" onchange="stopAudio()">
          <option value="0.7">ゆっくり (0.7x)</option>
          <option value="0.9" selected>標準 (0.9x)</option>
          <option value="1.1">速め (1.1x)</option>
        </select>
      </div>
      <div>
        <button class="btn-primary" id="btnAudioPlay" onclick="playFullAudio()">再生</button>
        <button class="btn-sub" id="btnAudioStop" onclick="stopAudio()" disabled>停止</button>
      </div>
    </div>

    <!-- 音読録音 -->
    <div class="card" style="margin-bottom: 0;">
      <h2>音読録音</h2>
      <div>
        <button class="btn-success" id="btnRecStart" onclick="startFullRecognition()">録音開始</button>
        <button class="btn-danger" id="btnRecStop" onclick="stopFullRecognition()" disabled>録音終了</button>
      </div>
      <p id="recStatus" style="color: var(--text-sub); font-size: 12.5px; margin-top: 8px; min-height: 18px; line-height: 1.3;"></p>
    </div>
  </div>

  <!-- 評価結果ダッシュボード -->
  <div class="card" id="resultArea" style="display:none;">
    <h2>評価結果分析</h2>

    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-label">伝わる度（総合）</div>
        <div class="metric-value" id="scoreVal">0<span class="metric-unit"> / 100</span></div>
      </div>
      <div class="metric-card" id="chunkMetricCard" style="display:none;">
        <div class="metric-label">チャンク精度</div>
        <div class="metric-value" id="chunkVal">0<span class="metric-unit"> / 100</span></div>
      </div>
      <div class="metric-card">
        <div class="metric-label">発話スピード</div>
        <div class="metric-value" id="wpmVal">0<span class="metric-unit"> WPM</span></div>
        <div class="metric-desc" id="wpmDesc">目安: 100〜130 WPM</div>
      </div>
    </div>

    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:var(--color-perfect)"></div> PERFECT</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--color-near)"></div> NEAR</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--color-again)"></div> TRY AGAIN</div>
    </div>

    <div id="wordDisplay" style="line-height: 2.1;"></div>
  </div>

  <!-- 苦手単語トレーニング -->
  <div class="card" id="weakArea" style="display:none;">
    <h2>苦手単語トレーニング</h2>
    <p style="font-size: 12.5px; color: var(--text-sub);">通じなかった単語の個別発音チェックです。</p>
    <div id="weakWordsList"></div>
  </div>

  <script>
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbzisAR6N-lJwFsODd3wK5MUDrDP8nwL8Ex6kjMGi5mvzL2fzGzSXvWYZhzb9RF5MV-u/exec';

    let currentMode = 'teacher';
    let teacherTaskList = [];
    let originalCategoryList = [];
    let globalWeakWords = [];
    let activeRecognition = null;
    let recStartTime = 0;

    window.onload = () => {
      const savedId = localStorage.getItem('english_app_student_id');
      if (savedId) {
        document.getElementById('studentId').value = savedId;
      }

      fetch(`${GAS_API_URL}?action=getTasks`)
        .then(res => res.json())
        .then(data => {
          teacherTaskList = data.teacherTasks || [];
          const taskSelect = document.getElementById('taskSelect');
          taskSelect.innerHTML = '';
          if (teacherTaskList.length === 0) {
            taskSelect.innerHTML = '<option value="">登録された配信課題がありません</option>';
          } else {
            teacherTaskList.forEach((t, index) => {
              const opt = document.createElement('option');
              opt.value = index;
              opt.innerText = t.title;
              taskSelect.appendChild(opt);
            });
            onTaskChange();
          }

          /* オリジナル原稿シートのA列を参照した選択肢の反映 */
          originalCategoryList = data.originalCategories || [];
          const origSelect = document.getElementById('originalCategorySelect');
          origSelect.innerHTML = '';
          if (originalCategoryList.length === 0) {
            origSelect.innerHTML = '<option value="通常授業">通常授業</option>';
          } else {
            originalCategoryList.forEach(cat => {
              const opt = document.createElement('option');
              opt.value = cat;
              opt.innerText = cat;
              origSelect.appendChild(opt);
            });
          }
        })
        .catch(err => {
          console.error(err);
          document.getElementById('taskSelect').innerHTML = '<option value="">データの読み込みに失敗しました</option>';
        });
    };

    function saveStudentId() {
      const val = document.getElementById('studentId').value;
      localStorage.setItem('english_app_student_id', val);
    }

    function switchMode(mode) {
      stopAudio();
      currentMode = mode;
      document.getElementById('tabTeacher').className = 'tab-btn ' + (mode === 'teacher' ? 'active' : '');
      document.getElementById('tabOriginal').className = 'tab-btn ' + (mode === 'original' ? 'active' : '');
      
      document.getElementById('modeTeacherArea').style.display = mode === 'teacher' ? 'block' : 'none';
      document.getElementById('modeOriginalArea').style.display = mode === 'original' ? 'block' : 'none';
      
      if (mode === 'teacher') {
        onTaskChange();
      } else {
        document.getElementById('sentence').value = '';
      }
    }

    function onTaskChange() {
      stopAudio();
      const idx = document.getElementById('taskSelect').value;
      if (idx !== "" && teacherTaskList[idx]) {
        document.getElementById('sentence').value = teacherTaskList[idx].text;
      }
    }

    function autoChunkText(text) {
      if (!text) return '';
      let clean = text.replace(/\s*\/\s*/g, ' ');
      clean = clean.replace(/([.,?!;:])/g, '$1 /');
      clean = clean.replace(/\b(because|when|if|that|which|who|where|while|although|so|but|and)\b/gi, '/ $1');
      clean = clean.replace(/\b(in|on|at|to|for|with|from|by|about|into|through)\b/gi, '/ $1');
      return clean.replace(/\/\s*\//g, '/').replace(/^\s*\/\s*/, '').replace(/\/\s*$/, '').trim();
    }

    function applyAutoChunking() {
      const input = document.getElementById('sentence').value;
      if (!input.trim()) return alert('英文を入力または選択してください');
      document.getElementById('sentence').value = autoChunkText(input);
    }

    function processImage(input) {
      if (!input.files || !input.files[0]) return;
      const file = input.files[0];
      const status = document.getElementById('ocrStatus');
      
      status.innerText = '画像から文字を読み取っています...';

      Tesseract.recognize(file, 'eng', {
        logger: m => {
          if(m.status === 'recognizing text') {
            status.innerText = `読み取り中... ${Math.round(m.progress * 100)}%`;
          }
        }
      }).then(({ data: { text } }) => {
        status.innerText = '読み取り完了。';
        const cleanText = text.replace(/\n+/g, ' ').trim();
        document.getElementById('sentence').value = autoChunkText(cleanText);
      }).catch(err => {
        status.innerText = '読み取り失敗。';
      });
    }

    function playAudioText(text, rate = 0.9) {
      if (!text) return;
      speechSynthesis.cancel();
      const cleanText = text.replace(/\//g, ' ');
      const uttr = new SpeechSynthesisUtterance(cleanText);
      uttr.lang = 'en-US';
      uttr.rate = parseFloat(rate);
      speechSynthesis.speak(uttr);
    }

    /* 再生・停止のシンプル2ボタン制御 */
    function playFullAudio() {
      const text = document.getElementById('sentence').value.replace(/\//g, ' ').trim();
      if (!text) return alert('英文を入力してください');

      speechSynthesis.cancel();
      const rate = document.getElementById('speechRate').value;
      const uttr = new SpeechSynthesisUtterance(text);
      uttr.lang = 'en-US';
      uttr.rate = parseFloat(rate);

      uttr.onend = () => { updateAudioButtons('stopped'); };
      uttr.onerror = () => { updateAudioButtons('stopped'); };

      speechSynthesis.speak(uttr);
      updateAudioButtons('playing');
    }

    function stopAudio() {
      speechSynthesis.cancel();
      updateAudioButtons('stopped');
    }

    function updateAudioButtons(state) {
      const btnPlay = document.getElementById('btnAudioPlay');
      const btnStop = document.getElementById('btnAudioStop');

      if (state === 'playing') {
        btnPlay.innerText = '再生中...';
        btnPlay.disabled = true;
        btnStop.disabled = false;
      } else {
        btnPlay.innerText = '再生';
        btnPlay.disabled = false;
        btnStop.disabled = true;
      }
    }

    function getLevenshteinDistance(a, b) {
      const matrix = [];
      for (let i = 0; i <= b.length; i++) matrix[i] = [i];
      for (let j = 0; j <= a.length; j++) matrix[0][j] = j;

      for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
          if (b.charAt(i - 1) === a.charAt(j - 1)) {
            matrix[i][j] = matrix[i - 1][j - 1];
          } else {
            matrix[i][j] = Math.min(
              matrix[i - 1][j - 1] + 1,
              Math.min(matrix[i][j - 1] + 1, matrix[i - 1][j] + 1)
            );
          }
        }
      }
      return matrix[b.length][a.length];
    }

    function startFullRecognition() {
      stopAudio();
      const studentId = document.getElementById('studentId').value.trim();
      if (!studentId || studentId.length < 3) {
        alert('生徒ID（半角4桁）を正しく入力してください。');
        return;
      }

      const originalText = document.getElementById('sentence').value.trim();
      if (!originalText) return alert('英文を入力してください');

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return alert('ブラウザが音声認識に対応していません (Google Chrome推奨)');

      activeRecognition = new SpeechRecognition();
      activeRecognition.lang = 'en-US';
      activeRecognition.interimResults = true;
      
      recStartTime = Date.now();

      document.getElementById('recStatus').innerText = '録音中... 音読してください。（終了時は「録音終了」を押します）';
      document.getElementById('btnRecStart').disabled = true;
      document.getElementById('btnRecStop').disabled = false;

      let finalTranscript = '';

      activeRecognition.onresult = (event) => {
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            finalTranscript += event.results[i][0].transcript + ' ';
          }
        }
      };

      activeRecognition.onerror = (event) => {
        resetRecUi();
        document.getElementById('recStatus').innerText = 'エラー: ' + event.error;
      };

      activeRecognition.onend = () => {
        resetRecUi();
        const durationSec = (Date.now() - recStartTime) / 1000;
        analyzeSpeech(originalText, finalTranscript, durationSec);
      };

      activeRecognition.start();
    }

    function stopFullRecognition() {
      if (activeRecognition) {
        document.getElementById('recStatus').innerText = '判定中...';
        activeRecognition.stop();
      }
    }

    function resetRecUi() {
      document.getElementById('btnRecStart').disabled = false;
      document.getElementById('btnRecStop').disabled = true;
    }

    function analyzeSpeech(original, spoken, durationSec) {
      document.getElementById('recStatus').innerText = '判定完了。結果を確認してください。';

      const spokenWordsAll = spoken.match(/[a-zA-Z0-9']+/g) || [];
      const wpm = durationSec > 0 ? Math.round((spokenWordsAll.length / durationSec) * 60) : 0;
      
      document.getElementById('wpmVal').innerText = wpm;
      const wpmDesc = document.getElementById('wpmDesc');
      if (wpm < 80) {
        wpmDesc.innerText = 'ゆっくり（目標: 100〜130）';
      } else if (wpm <= 140) {
        wpmDesc.innerText = '標準・適正スピード';
      } else {
        wpmDesc.innerText = '速め（目標: 100〜130）';
      }

      const rawTokens = original.split(/(\s+|\/)/);
      const spokenWords = spokenWordsAll.map(w => w.toLowerCase());

      const wordDisplay = document.getElementById('wordDisplay');
      wordDisplay.innerHTML = '';
      globalWeakWords = [];

      let totalPoints = 0;
      let totalWords = 0;
      let spokenIndex = 0;

      let chunkCorrectCount = 0;
      let hasChunks = original.includes('/');

      rawTokens.forEach(token => {
        if (!token.trim()) return;

        if (token === '/') {
          const slashSpan = document.createElement('span');
          slashSpan.className = 'chunk-divider';
          slashSpan.innerText = '/';
          wordDisplay.appendChild(slashSpan);
          return;
        }

        const cleanWord = token.replace(/[^a-zA-Z0-9']/g, '').toLowerCase();
        if (!cleanWord) return;

        totalWords++;
        let matchQuality = 'again';
        let foundPos = -1;

        for (let i = spokenIndex; i < Math.min(spokenIndex + 5, spokenWords.length); i++) {
          const sWord = spokenWords[i];
          if (sWord === cleanWord) {
            matchQuality = 'perfect';
            foundPos = i;
            break;
          } else {
            const dist = getLevenshteinDistance(cleanWord, sWord);
            if (dist <= 2 && cleanWord.length > 2) {
              matchQuality = 'near';
              foundPos = i;
              break;
            }
          }
        }

        const span = document.createElement('span');
        span.className = 'word ';

        if (matchQuality === 'perfect') {
          span.className += 'word-perfect';
          span.innerText = token;
          totalPoints += 1.0;
          spokenIndex = foundPos + 1;
          chunkCorrectCount++;
        } else if (matchQuality === 'near') {
          span.className += 'word-near';
          span.innerText = token;
          totalPoints += 0.6;
          spokenIndex = foundPos + 1;
          chunkCorrectCount++;
        } else {
          span.className += 'word-again';
          span.innerText = token;
          if (!globalWeakWords.includes(cleanWord)) {
            globalWeakWords.push(cleanWord);
          }
        }
        wordDisplay.appendChild(span);
      });

      const finalScore = totalWords > 0 ? Math.round((totalPoints / totalWords) * 100) : 0;
      document.getElementById('scoreVal').innerHTML = `${finalScore}<span class="metric-unit"> / 100</span>`;

      const chunkMetricCard = document.getElementById('chunkMetricCard');
      if (hasChunks) {
        const chunkScore = totalWords > 0 ? Math.round((chunkCorrectCount / totalWords) * 100) : 0;
        document.getElementById('chunkVal').innerHTML = `${chunkScore}<span class="metric-unit"> / 100</span>`;
        chunkMetricCard.style.display = 'block';
      } else {
        chunkMetricCard.style.display = 'none';
      }

      document.getElementById('resultArea').style.display = 'block';
      renderWeakWords();

      const studentId = document.getElementById('studentId').value.trim();
      const modeName = currentMode === 'teacher' ? '配信課題' : 'オリジナル原稿';
      
      let taskName = '';
      if (currentMode === 'teacher') {
        const select = document.getElementById('taskSelect');
        taskName = select.options[select.selectedIndex]?.text || '課題未選択';
      } else {
        const select = document.getElementById('originalCategorySelect');
        taskName = select.value || select.options[select.selectedIndex]?.text || 'オリジナル英作文';
      }

      fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({
          studentId: studentId,
          mode: modeName,
          taskName: taskName,
          originalText: original,
          spokenText: spoken,
          score: finalScore,
          weakWords: globalWeakWords
        })
      });
    }

    function renderWeakWords() {
      const weakArea = document.getElementById('weakArea');
      const container = document.getElementById('weakWordsList');
      container.innerHTML = '';

      if (globalWeakWords.length === 0) {
        weakArea.style.display = 'none';
        return;
      }

      weakArea.style.display = 'block';
      globalWeakWords.forEach(word => {
        const div = document.createElement('div');
        div.className = 'weak-card';
        div.innerHTML = `
          <strong style="font-size: 16px; color: var(--text-main);">${word}</strong>
          <div>
            <button class="btn-sub" onclick="playAudioText('${word}', 0.7)">音声を聞く</button>
            <button class="btn-primary" onclick="testSingleWord('${word}', this)">発音テスト</button>
            <span class="test-result" style="margin-left:6px; font-weight:bold;"></span>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function testSingleWord(targetWord, btnElement) {
      stopAudio();
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const recognition = new SpeechRecognition();
      recognition.lang = 'en-US';

      const resultSpan = btnElement.nextElementSibling;
      resultSpan.innerText = '聞き取り中...';
      resultSpan.style.color = 'var(--text-sub)';

      recognition.onresult = (event) => {
        const spoken = event.results[0][0].transcript.toLowerCase().trim();
        if (spoken.includes(targetWord.toLowerCase())) {
          resultSpan.innerText = '正解 (PERFECT)';
          resultSpan.style.color = 'var(--color-perfect)';
        } else {
          resultSpan.innerText = `不一致 (${spoken})`;
          resultSpan.style.color = 'var(--color-again)';
        }
      };

      recognition.onerror = () => { resultSpan.innerText = 'エラー'; };
      recognition.start();
    }
  </script>
</body>
</html>
