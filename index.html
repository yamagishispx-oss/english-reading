<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英語音読トレーニング - 伝わる英語を目指そう</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bg-main: #f8fafc;
      --surface: #ffffff;
      --text-main: #0f172a;
      --text-sub: #475569;
      --border-color: #e2e8f0;
      
      --color-perfect: #16a34a;
      --bg-perfect: #dcfce7;
      --color-near: #d97706;
      --bg-near: #fef3c7;
      --color-again: #dc2626;
      --bg-again: #fee2e2;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 24px 16px;
      max-width: 680px;
      margin: 0 auto;
      color: var(--text-main);
      background: var(--bg-main);
      line-height: 1.6;
    }

    /* 洗練された洗練されたヘッダーデザイン */
    .header-card {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #1e3a8a 100%);
      color: #ffffff;
      padding: 28px 24px;
      border-radius: 16px;
      margin-bottom: 24px;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .header-card h1 {
      margin: 0;
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .header-card .sub-message {
      font-size: 0.95rem;
      font-weight: 600;
      margin-top: 12px;
      color: #38bdf8;
      letter-spacing: 0.02em;
    }
    .header-card p {
      font-size: 0.85rem;
      margin: 8px 0 0 0;
      color: #94a3b8;
    }

    .card {
      background: var(--surface);
      padding: 24px;
      border-radius: 14px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 12px -2px rgba(0,0,0,0.03);
      margin-bottom: 20px;
    }

    h2 {
      margin-top: 0;
      color: var(--text-main);
      font-size: 1.1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 10px;
      margin-bottom: 16px;
    }

    /* モダンなセグメントコントロール風タブ */
    .tab-container {
      display: flex;
      background: #e2e8f0;
      padding: 4px;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      font-size: 14px;
      font-weight: 700;
      border: none;
      background: transparent;
      color: var(--text-sub);
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    label { font-weight: 600; font-size: 14px; color: var(--text-sub); }
    input[type="text"], textarea, select {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      box-sizing: border-box;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      margin-top: 6px;
      background: #ffffff;
      color: var(--text-main);
      transition: border-color 0.2s;
    }
    input[type="text"]:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--primary);
    }
    textarea { height: 100px; font-family: inherit; resize: vertical; }

    button {
      padding: 11px 20px;
      font-size: 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      margin-right: 8px;
      margin-top: 8px;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: #ffffff; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
    .btn-success { background: #16a34a; color: #ffffff; }
    .btn-danger { background: #dc2626; color: #ffffff; }
    .btn-sub { background: #64748b; color: #ffffff; }

    /* 結果表示ダッシュボード */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .metric-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 14px;
      border-radius: 10px;
      text-align: center;
    }
    .metric-label { font-size: 12px; font-weight: 700; color: var(--text-sub); }
    .metric-value { font-size: 26px; font-weight: 800; color: var(--primary); margin-top: 4px; }
    .metric-unit { font-size: 13px; font-weight: 600; color: #64748b; }

    /* 3段階判定ハイライト */
    .word {
      display: inline-block;
      padding: 4px 9px;
      margin: 4px;
      border-radius: 6px;
      font-size: 17px;
      font-weight: 700;
      transition: transform 0.1s;
    }
    .word-perfect { background: var(--bg-perfect); color: var(--color-perfect); border: 1px solid #bbf7d0; }
    .word-near { background: var(--bg-near); color: var(--color-near); border: 1px solid #fde68a; }
    .word-again { background: var(--bg-again); color: var(--color-again); border: 1px solid #fecdd3; }
    .chunk-divider { color: #94a3b8; font-weight: 300; margin: 0 4px; font-size: 18px; }

    .weak-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff1f2;
      border: 1px solid #fecdd3;
      padding: 12px 16px;
      border-radius: 8px;
      margin-top: 8px;
    }
    #ocrStatus { font-weight: 600; color: var(--primary); margin-top: 8px; font-size: 14px; }
    .legend { display: flex; gap: 12px; font-size: 12px; font-weight: 600; margin-bottom: 12px; }
    .legend-item { display: flex; align-items: center; gap: 4px; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
  </style>
</head>
<body>

  <!-- アプリタイトルヘッダー -->
  <div class="header-card">
    <h1>英語音読トレーニング</h1>
    <div class="sub-message">〜 相手に「伝わる英語」を目指して練習しよう！ 〜</div>
    <p>お手本を聞いて声に出し、AIチェックで通じる度・リズム・スピードをテストしてみよう。</p>
  </div>

  <!-- 生徒情報入力 -->
  <div class="card" style="background: #f0f9ff; border-color: #bae6fd;">
    <label for="studentId">生徒ID（半角4桁／入力必須）</label>
    <input type="text" id="studentId" placeholder="例: 1459" maxlength="4" oninput="saveStudentId()">
  </div>

  <!-- モード選択 -->
  <div class="tab-container">
    <button id="tabTeacher" class="tab-btn active" onclick="switchMode('teacher')">配信課題</button>
    <button id="tabOriginal" class="tab-btn" onclick="switchMode('original')">オリジナル原稿</button>
  </div>

  <!-- 原稿の用意 -->
  <div class="card">
    <h2>原稿の準備</h2>

    <div id="modeTeacherArea">
      <label>練習する課題を選択してください:</label>
      <select id="taskSelect" onchange="onTaskChange()">
        <option value="">読み込み中...</option>
      </select>
    </div>

    <div id="modeOriginalArea" style="display:none;">
      <div style="margin-bottom: 12px;">
        <label>対象の授業名・単元名を選択してください:</label>
        <select id="originalCategorySelect">
          <option value="">読み込み中...</option>
        </select>
      </div>

      <div style="background: #f8fafc; padding: 14px; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 12px;">
        <label>画像から文字を読み込む（OCR）:</label><br>
        <input type="file" id="imageInput" accept="image/*" onchange="processImage(this)" style="margin-top:6px;">
        <div id="ocrStatus"></div>
      </div>
      <label>英文の確認・編集（/ でチャンク区切り）:</label>
    </div>

    <textarea id="sentence" placeholder="選択された英文または入力した英文がここに表示されます..."></textarea>
  </div>

  <!-- お手本を聞いて練習 -->
  <div class="card">
    <h2>音声再生（お手本）</h2>
    <div style="margin-bottom: 12px;">
      <label>再生速度: </label>
      <select id="speechRate" style="width: auto; display: inline-block; padding: 6px 12px;" onchange="stopAudio()">
        <option value="0.7">ゆっくり (0.7x)</option>
        <option value="0.9" selected>標準 (0.9x)</option>
        <option value="1.1">速め (1.1x)</option>
      </select>
    </div>
    <button class="btn-primary" id="btnAudioPlay" onclick="playFullAudio()">再生</button>
    <button class="btn-sub" id="btnAudioPause" onclick="pauseAudio()" disabled>一時停止</button>
    <button class="btn-sub" id="btnAudioStop" onclick="stopAudio()" disabled>最初から</button>
  </div>

  <!-- 音読を録音する -->
  <div class="card">
    <h2>音読録音</h2>
    <button class="btn-success" id="btnRecStart" onclick="startFullRecognition()">録音開始</button>
    <button class="btn-danger" id="btnRecStop" onclick="stopFullRecognition()" disabled>録音終了</button>
    <p id="recStatus" style="color: var(--text-sub); font-size: 14px; margin-top: 12px; min-height: 20px;"></p>
  </div>

  <!-- 評価結果ダッシュボード -->
  <div class="card" id="resultArea" style="display:none;">
    <h2>評価結果分析</h2>

    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-label">伝わる度（総合）</div>
        <div class="metric-value" id="scoreVal">0<span class="metric-unit">%</span></div>
      </div>
      <div class="metric-card">
        <div class="metric-label">発話スピード</div>
        <div class="metric-value" id="wpmVal">0<span class="metric-unit"> WPM</span></div>
      </div>
      <div class="metric-card" id="chunkMetricCard" style="display:none;">
        <div class="metric-label">チャンク精度</div>
        <div class="metric-value" id="chunkVal">0<span class="metric-unit">%</span></div>
      </div>
    </div>

    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:var(--color-perfect)"></div> PERFECT（通じた）</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--color-near)"></div> NEAR（惜しい！）</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--color-again)"></div> TRY AGAIN（要練習）</div>
    </div>

    <div id="wordDisplay" style="line-height: 2.2;"></div>
  </div>

  <!-- 苦手単語トレーニング -->
  <div class="card" id="weakArea" style="display:none;">
    <h2>苦手単語トレーニング</h2>
    <p style="font-size: 13px; color: var(--text-sub);">AIに通じなかった単語の個別発音チェックです。</p>
    <div id="weakWordsList"></div>
  </div>

  <script>
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbzisAR6N-lJwFsODd3wK5MUDrDP8nwL8Ex6kjMGi5mvzL2fzGzSXvWYZhzb9RF5MV-u/exec';

    let currentMode = 'teacher';
    let teacherTaskList = [];
    let originalCategoryList = [];
    let globalWeakWords = [];
    let activeRecognition = null;
    let currentUtterance = null;

    let recStartTime = 0;
    let speechTimestamps = [];

    window.onload = () => {
      const savedId = localStorage.getItem('english_app_student_id');
      if (savedId) {
        document.getElementById('studentId').value = savedId;
      }

      fetch(`${GAS_API_URL}?action=getTasks`)
        .then(res => res.json())
        .then(data => {
          teacherTaskList = data.teacherTasks || [];
          const taskSelect = document.getElementById('taskSelect');
          taskSelect.innerHTML = '';
          if (teacherTaskList.length === 0) {
            taskSelect.innerHTML = '<option value="">登録された配信課題がありません</option>';
          } else {
            teacherTaskList.forEach((t, index) => {
              const opt = document.createElement('option');
              opt.value = index;
              opt.innerText = t.title;
              taskSelect.appendChild(opt);
            });
            onTaskChange();
          }

          originalCategoryList = data.originalCategories || [];
          const origSelect = document.getElementById('originalCategorySelect');
          origSelect.innerHTML = '';
          if (originalCategoryList.length === 0) {
            origSelect.innerHTML = '<option value="">登録された単元がありません</option>';
          } else {
            originalCategoryList.forEach(cat => {
              const opt = document.createElement('option');
              opt.value = cat;
              opt.innerText = cat;
              origSelect.appendChild(opt);
            });
          }
        })
        .catch(err => {
          console.error(err);
          document.getElementById('taskSelect').innerHTML = '<option value="">データの読み込みに失敗しました</option>';
        });
    };

    function saveStudentId() {
      const val = document.getElementById('studentId').value;
      localStorage.setItem('english_app_student_id', val);
    }

    function switchMode(mode) {
      stopAudio();
      currentMode = mode;
      document.getElementById('tabTeacher').className = 'tab-btn ' + (mode === 'teacher' ? 'active' : '');
      document.getElementById('tabOriginal').className = 'tab-btn ' + (mode === 'original' ? 'active' : '');
      
      document.getElementById('modeTeacherArea').style.display = mode === 'teacher' ? 'block' : 'none';
      document.getElementById('modeOriginalArea').style.display = mode === 'original' ? 'block' : 'none';
      
      if (mode === 'teacher') {
        onTaskChange();
      } else {
        document.getElementById('sentence').value = '';
      }
    }

    function onTaskChange() {
      stopAudio();
      const idx = document.getElementById('taskSelect').value;
      if (idx !== "" && teacherTaskList[idx]) {
        document.getElementById('sentence').value = teacherTaskList[idx].text;
      }
    }

    function processImage(input) {
      if (!input.files || !input.files[0]) return;
      const file = input.files[0];
      const status = document.getElementById('ocrStatus');
      
      status.innerText = '画像から文字を読み取っています...（数秒かかります）';

      Tesseract.recognize(file, 'eng', {
        logger: m => {
          if(m.status === 'recognizing text') {
            status.innerText = `読み取り中... ${Math.round(m.progress * 100)}%`;
          }
        }
      }).then(({ data: { text } }) => {
        status.innerText = '読み取りが完了しました。必要に応じて文字を修正してください。';
        const cleanText = text.replace(/\n+/g, ' ').trim();
        document.getElementById('sentence').value = cleanText;
      }).catch(err => {
        status.innerText = '画像の読み取りに失敗しました。別の画像でお試しください。';
      });
    }

    function playAudioText(text, rate = 0.9) {
      if (!text) return;
      speechSynthesis.cancel();
      const cleanText = text.replace(/\//g, ' ');
      const uttr = new SpeechSynthesisUtterance(cleanText);
      uttr.lang = 'en-US';
      uttr.rate = parseFloat(rate);
      speechSynthesis.speak(uttr);
    }

    function playFullAudio() {
      const text = document.getElementById('sentence').value.trim();
      const rate = document.getElementById('speechRate').value;
      if (!text) return alert('英文を入力してください');

      if (speechSynthesis.paused && speechSynthesis.speaking) {
        speechSynthesis.resume();
        updateAudioButtons('playing');
        return;
      }

      speechSynthesis.cancel();
      const cleanText = text.replace(/\//g, ' ');
      currentUtterance = new SpeechSynthesisUtterance(cleanText);
      currentUtterance.lang = 'en-US';
      currentUtterance.rate = parseFloat(rate);

      currentUtterance.onend = () => { updateAudioButtons('stopped'); };
      currentUtterance.onerror = () => { updateAudioButtons('stopped'); };

      speechSynthesis.speak(currentUtterance);
      updateAudioButtons('playing');
    }

    function pauseAudio() {
      if (speechSynthesis.speaking && !speechSynthesis.paused) {
        speechSynthesis.pause();
        updateAudioButtons('paused');
      }
    }

    function stopAudio() {
      speechSynthesis.cancel();
      updateAudioButtons('stopped');
    }

    function updateAudioButtons(state) {
      const btnPlay = document.getElementById('btnAudioPlay');
      const btnPause = document.getElementById('btnAudioPause');
      const btnStop = document.getElementById('btnAudioStop');

      if (state === 'playing') {
        btnPlay.innerText = '再生中';
        btnPlay.disabled = true;
        btnPause.innerText = '一時停止';
        btnPause.disabled = false;
        btnStop.disabled = false;
      } else if (state === 'paused') {
        btnPlay.innerText = '再開';
        btnPlay.disabled = false;
        btnPause.innerText = '一時停止中';
        btnPause.disabled = true;
        btnStop.disabled = false;
      } else {
        btnPlay.innerText = '再生';
        btnPlay.disabled = false;
        btnPause.innerText = '一時停止';
        btnPause.disabled = true;
        btnStop.disabled = true;
      }
    }

    /* アルゴリズム：レベンシュタイン距離（文字列類似度計算） */
    function getLevenshteinDistance(a, b) {
      const matrix = [];
      for (let i = 0; i <= b.length; i++) matrix[i] = [i];
      for (let j = 0; j <= a.length; j++) matrix[0][j] = j;

      for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
          if (b.charAt(i - 1) === a.charAt(j - 1)) {
            matrix[i][j] = matrix[i - 1][j - 1];
          } else {
            matrix[i][j] = Math.min(
              matrix[i - 1][j - 1] + 1,
              Math.min(matrix[i][j - 1] + 1, matrix[i - 1][j] + 1)
            );
          }
        }
      }
      return matrix[b.length][a.length];
    }

    function startFullRecognition() {
      stopAudio();
      const studentId = document.getElementById('studentId').value.trim();
      if (!studentId || studentId.length < 3) {
        alert('生徒ID（半角4桁）を正しく入力してください。');
        return;
      }

      const originalText = document.getElementById('sentence').value.trim();
      if (!originalText) return alert('英文を入力してください');

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return alert('ブラウザが音声認識に対応していません (Google Chrome推奨)');

      activeRecognition = new SpeechRecognition();
      activeRecognition.lang = 'en-US';
      activeRecognition.interimResults = true;
      
      speechTimestamps = [];
      recStartTime = Date.now();

      document.getElementById('recStatus').innerText = '録音中... 声を出して音読してください。（終了時は「録音終了」を押します）';
      document.getElementById('btnRecStart').disabled = true;
      document.getElementById('btnRecStop').disabled = false;

      let finalTranscript = '';

      activeRecognition.onresult = (event) => {
        let interim = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            finalTranscript += event.results[i][0].transcript + ' ';
            speechTimestamps.push(Date.now());
          } else {
            interim += event.results[i][0].transcript;
          }
        }
      };

      activeRecognition.onerror = (event) => {
        resetRecUi();
        document.getElementById('recStatus').innerText = 'エラーが発生しました: ' + event.error;
      };

      activeRecognition.onend = () => {
        resetRecUi();
        const durationSec = (Date.now() - recStartTime) / 1000;
        analyzeSpeech(originalText, finalTranscript, durationSec);
      };

      activeRecognition.start();
    }

    function stopFullRecognition() {
      if (activeRecognition) {
        document.getElementById('recStatus').innerText = '判定中...';
        activeRecognition.stop();
      }
    }

    function resetRecUi() {
      document.getElementById('btnRecStart').disabled = false;
      document.getElementById('btnRecStop').disabled = true;
    }

    function analyzeSpeech(original, spoken, durationSec) {
      document.getElementById('recStatus').innerText = '判定が完了しました。下の分析結果を確認してください。';

      // 1. WPM（発音スピード）の計算
      const spokenWordsAll = spoken.match(/[a-zA-Z0-9']+/g) || [];
      const wpm = durationSec > 0 ? Math.round((spokenWordsAll.length / durationSec) * 60) : 0;
      document.getElementById('wpmVal').innerText = wpm;

      // チャンク構造と単語の抽出
      const rawTokens = original.split(/(\s+|\/)/);
      const spokenWords = spokenWordsAll.map(w => w.toLowerCase());

      const wordDisplay = document.getElementById('wordDisplay');
      wordDisplay.innerHTML = '';
      globalWeakWords = [];

      let totalPoints = 0;
      let totalWords = 0;
      let spokenIndex = 0;

      let chunkCount = 0;
      let chunkCorrectCount = 0;
      let hasChunks = original.includes('/');

      rawTokens.forEach(token => {
        if (!token.trim()) return;

        if (token === '/') {
          chunkCount++;
          const slashSpan = document.createElement('span');
          slashSpan.className = 'chunk-divider';
          slashSpan.innerText = '/';
          wordDisplay.appendChild(slashSpan);
          return;
        }

        const cleanWord = token.replace(/[^a-zA-Z0-9']/g, '').toLowerCase();
        if (!cleanWord) return;

        totalWords++;
        
        let matchQuality = 'again'; // 'perfect', 'near', 'again'
        let foundPos = -1;

        // 音声認識単語とのマッチング・3段階評価判定
        for (let i = spokenIndex; i < Math.min(spokenIndex + 5, spokenWords.length); i++) {
          const sWord = spokenWords[i];
          if (sWord === cleanWord) {
            matchQuality = 'perfect';
            foundPos = i;
            break;
          } else {
            const dist = getLevenshteinDistance(cleanWord, sWord);
            if (dist <= 2 && cleanWord.length > 2) {
              matchQuality = 'near';
              foundPos = i;
              break;
            }
          }
        }

        const span = document.createElement('span');
        span.className = 'word ';

        if (matchQuality === 'perfect') {
          span.className += 'word-perfect';
          span.innerText = token;
          totalPoints += 1.0;
          spokenIndex = foundPos + 1;
          chunkCorrectCount++;
        } else if (matchQuality === 'near') {
          span.className += 'word-near';
          span.innerText = token;
          totalPoints += 0.6;
          spokenIndex = foundPos + 1;
          chunkCorrectCount++;
        } else {
          span.className += 'word-again';
          span.innerText = token;
          if (!globalWeakWords.includes(cleanWord)) {
            globalWeakWords.push(cleanWord);
          }
        }
        wordDisplay.appendChild(span);
      });

      // 総合伝わる度スコア (%)
      const finalScore = totalWords > 0 ? Math.round((totalPoints / totalWords) * 100) : 0;
      document.getElementById('scoreVal').innerText = finalScore;

      // チャンク精度 (%)
      const chunkMetricCard = document.getElementById('chunkMetricCard');
      if (hasChunks) {
        const chunkScore = totalWords > 0 ? Math.round((chunkCorrectCount / totalWords) * 100) : 0;
        document.getElementById('chunkVal').innerText = chunkScore;
        chunkMetricCard.style.display = 'block';
      } else {
        chunkMetricCard.style.display = 'none';
      }

      document.getElementById('resultArea').style.display = 'block';

      renderWeakWords();

      // GASへの結果自動送信
      const studentId = document.getElementById('studentId').value.trim();
      const modeName = currentMode === 'teacher' ? '配信課題' : 'オリジナル原稿';
      
      let taskName = '';
      if (currentMode === 'teacher') {
        const select = document.getElementById('taskSelect');
        taskName = select.options[select.selectedIndex]?.text || '課題未選択';
      } else {
        const select = document.getElementById('originalCategorySelect');
        taskName = select.options[select.selectedIndex]?.value || 'オリジナル英作文';
      }

      fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({
          studentId: studentId,
          mode: modeName,
          taskName: taskName,
          originalText: original,
          spokenText: spoken,
          score: finalScore,
          wpm: wpm,
          weakWords: globalWeakWords
        })
      });
    }

    function renderWeakWords() {
      const weakArea = document.getElementById('weakArea');
      const container = document.getElementById('weakWordsList');
      container.innerHTML = '';

      if (globalWeakWords.length === 0) {
        weakArea.style.display = 'none';
        return;
      }

      weakArea.style.display = 'block';
      globalWeakWords.forEach(word => {
        const div = document.createElement('div');
        div.className = 'weak-card';
        div.innerHTML = `
          <strong style="font-size: 17px; color: var(--text-main);">${word}</strong>
          <div>
            <button class="btn-sub" onclick="playAudioText('${word}', 0.7)">音声を聞く</button>
            <button class="btn-primary" onclick="testSingleWord('${word}', this)">発音テスト</button>
            <span class="test-result" style="margin-left:8px; font-weight:bold;"></span>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function testSingleWord(targetWord, btnElement) {
      stopAudio();
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const recognition = new SpeechRecognition();
      recognition.lang = 'en-US';

      const resultSpan = btnElement.nextElementSibling;
      resultSpan.innerText = '聞き取り中...';
      resultSpan.style.color = 'var(--text-sub)';

      recognition.onresult = (event) => {
        const spoken = event.results[0][0].transcript.toLowerCase().trim();
        if (spoken.includes(targetWord.toLowerCase())) {
          resultSpan.innerText = '正解 (PERFECT)';
          resultSpan.style.color = 'var(--color-perfect)';
        } else {
          resultSpan.innerText = `不一致 (${spoken})`;
          resultSpan.style.color = 'var(--color-again)';
        }
      };

      recognition.onerror = () => { resultSpan.innerText = 'エラー'; };
      recognition.start();
    }
  </script>
</body>
</html>
