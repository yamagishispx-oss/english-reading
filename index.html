<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英作文 音読＆弱点克服ツール</title>
  <!-- OCR用のライブラリ (Tesseract.js) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    body { font-family: 'Helvetica Neue', Arial, sans-serif; padding: 15px; max-width: 650px; margin: 0 auto; color: #333; background: #f8fafc; }
    .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; }
    h2 { margin-top: 0; color: #1e293b; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; font-size: 1.1rem; }
    
    .tab-container { display: flex; gap: 10px; margin-bottom: 15px; }
    .tab-btn { flex: 1; padding: 12px; font-size: 15px; font-weight: bold; border: 2px solid #cbd5e1; background: #f1f5f9; color: #64748b; border-radius: 8px; cursor: pointer; text-align: center; }
    .tab-btn.active { background: #2563eb; color: white; border-color: #2563eb; }

    input[type="text"] { width: 100%; padding: 10px; font-size: 16px; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 5px; margin-top: 5px; }
    textarea { width: 100%; height: 90px; font-size: 16px; padding: 8px; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 5px; margin-top: 8px; }
    select { width: 100%; padding: 10px; font-size: 15px; border-radius: 5px; border: 1px solid #cbd5e1; margin-top: 5px; }
    
    button { padding: 10px 18px; font-size: 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-right: 8px; margin-top: 5px; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: #2563eb; color: white; }
    .btn-success { background: #10b981; color: white; }
    .btn-danger { background: #ef4444; color: white; }
    .btn-sub { background: #64748b; color: white; }
    
    .word { display: inline-block; padding: 3px 8px; margin: 3px; border-radius: 4px; font-size: 18px; font-weight: bold; }
    .word-correct { background: #dcfce7; color: #166534; }
    .word-incorrect { background: #fee2e2; color: #991b1b; }
    
    .weak-card { display: flex; align-items: center; justify-content: space-between; background: #fff1f2; border: 1px solid #fecdd3; padding: 10px; border-radius: 6px; margin-top: 8px; }
    .score-badge { font-size: 28px; font-weight: bold; color: #2563eb; }
    #ocrStatus { font-weight: bold; color: #2563eb; margin-top: 8px; font-size: 14px; }
  </style>
</head>
<body>

  <!-- 生徒情報入力 -->
  <div class="card" style="background: #eff6ff; border: 1px solid #bfdbfe;">
    <label for="studentId">👤 <strong>生徒ID (4桁の数字 / 例: 1120, 1459):</strong></label>
    <input type="text" id="studentId" placeholder="例: 1459" maxlength="4" oninput="saveStudentId()">
  </div>

  <!-- モード選択 -->
  <div class="tab-container">
    <div id="tabTeacher" class="tab-btn active" onclick="switchMode('teacher')">👨‍🏫 先生の課題</div>
    <div id="tabOriginal" class="tab-btn" onclick="switchMode('original')">✏️ オリジナル原稿</div>
  </div>

  <!-- 原稿の用意 -->
  <div class="card">
    <h2>原稿を用意する</h2>

    <div id="modeTeacherArea">
      <label>練習する課題を選択してください:</label>
      <select id="taskSelect" onchange="onTaskChange()">
        <option value="">読み込み中...</option>
      </select>
    </div>

    <div id="modeOriginalArea" style="display:none;">
      <div style="margin-bottom: 12px;">
        <label>対象の授業名・単元名を選択してください:</label>
        <select id="originalCategorySelect">
          <option value="">読み込み中...</option>
        </select>
      </div>

      <div style="background: #f0f9ff; padding: 10px; border-radius: 6px; border: 1px solid #bae6fd; margin-bottom: 10px;">
        <label>📷 <strong>画像から文字を読み込む:</strong></label><br>
        <input type="file" id="imageInput" accept="image/*" onchange="processImage(this)" style="margin-top:5px;">
        <div id="ocrStatus"></div>
      </div>
      <label>英文の入力（手入力・編集可能）:</label>
    </div>

    <textarea id="sentence" placeholder="選択された英文または入力した英文がここに表示されます..."></textarea>
  </div>

  <!-- お手本を聞いて練習 -->
  <div class="card">
    <h2>お手本を聞いて練習する</h2>
    <div style="margin-bottom: 10px;">
      <label>速度: </label>
      <select id="speechRate" style="width: auto; display: inline-block;">
        <option value="0.7">ゆっくり (0.7x)</option>
        <option value="0.9" selected>標準 (0.9x)</option>
        <option value="1.1">速め (1.1x)</option>
      </select>
    </div>
    <button class="btn-primary" onclick="playFullAudio()">🔊 お手本を聞く</button>
  </div>

  <!-- 音読を録音する -->
  <div class="card">
    <h2>音読を録音する</h2>
    <button class="btn-success" id="btnRecStart" onclick="startFullRecognition()">🎙️ 録音開始</button>
    <button class="btn-danger" id="btnRecStop" onclick="stopFullRecognition()" disabled>⏹️ 録音終了</button>
    <p id="recStatus" style="color: #64748b; font-size: 14px; margin-top: 10px; min-height: 20px;"></p>
  </div>

  <!-- 正確さを確認する -->
  <div class="card" id="resultArea" style="display:none;">
    <h2>正確さを確認する</h2>
    <p><strong>全体の一致率: <span id="scoreVal" class="score-badge">0</span>%</strong></p>
    <p style="margin-bottom: 5px;"><strong>単語チェック:</strong> （緑＝OK / 赤＝もう一度）</p>
    <div id="wordDisplay" style="line-height: 2.0;"></div>
  </div>

  <!-- 苦手単語トレーニング -->
  <div class="card" id="weakArea" style="display:none;">
    <h2>苦手単語の集中トレーニング</h2>
    <p style="font-size: 13px; color: #64748b;">うまく認識されなかった単語です。個別に練習してみましょう！</p>
    <div id="weakWordsList"></div>
  </div>

  <script>
    // ⬇️ ここに取得したGASのURLを貼り付けてください
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbwfmoDpGjFURxVHEkz_eB-OASBCbu5dOsq-puymuVmdCKMLIR-zAjYelNLGjERnElC7/exec';

    let currentMode = 'teacher';
    let teacherTaskList = [];
    let originalCategoryList = [];
    let globalWeakWords = [];
    let activeRecognition = null;

    // 初期化：課題リスト・単元リストの取得 & 生徒ID復元
    window.onload = () => {
      const savedId = localStorage.getItem('english_app_student_id');
      if (savedId) {
        document.getElementById('studentId').value = savedId;
      }

      fetch(`${GAS_API_URL}?action=getTasks`)
        .then(res => res.json())
        .then(data => {
          // 教員課題のセット
          teacherTaskList = data.teacherTasks || [];
          const taskSelect = document.getElementById('taskSelect');
          taskSelect.innerHTML = '';
          if (teacherTaskList.length === 0) {
            taskSelect.innerHTML = '<option value="">登録された教員課題がありません</option>';
          } else {
            teacherTaskList.forEach((t, index) => {
              const opt = document.createElement('option');
              opt.value = index;
              opt.innerText = t.title;
              taskSelect.appendChild(opt);
            });
            onTaskChange();
          }

          // オリジナル単元のセット
          originalCategoryList = data.originalCategories || [];
          const origSelect = document.getElementById('originalCategorySelect');
          origSelect.innerHTML = '';
          if (originalCategoryList.length === 0) {
            origSelect.innerHTML = '<option value="">登録された単元がありません</option>';
          } else {
            originalCategoryList.forEach(cat => {
              const opt = document.createElement('option');
              opt.value = cat;
              opt.innerText = cat;
              origSelect.appendChild(opt);
            });
          }
        })
        .catch(err => {
          console.error(err);
          document.getElementById('taskSelect').innerHTML = '<option value="">データ読み込み失敗</option>';
        });
    };

    function saveStudentId() {
      const val = document.getElementById('studentId').value;
      localStorage.setItem('english_app_student_id', val);
    }

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('tabTeacher').className = 'tab-btn ' + (mode === 'teacher' ? 'active' : '');
      document.getElementById('tabOriginal').className = 'tab-btn ' + (mode === 'original' ? 'active' : '');
      
      document.getElementById('modeTeacherArea').style.display = mode === 'teacher' ? 'block' : 'none';
      document.getElementById('modeOriginalArea').style.display = mode === 'original' ? 'block' : 'none';
      
      if (mode === 'teacher') {
        onTaskChange();
      } else {
        document.getElementById('sentence').value = '';
      }
    }

    function onTaskChange() {
      const idx = document.getElementById('taskSelect').value;
      if (idx !== "" && teacherTaskList[idx]) {
        document.getElementById('sentence').value = teacherTaskList[idx].text;
      }
    }

    function processImage(input) {
      if (!input.files || !input.files[0]) return;
      const file = input.files[0];
      const status = document.getElementById('ocrStatus');
      
      status.innerText = '⏳ 画像から文字を読み取っています... (数秒かかります)';

      Tesseract.recognize(file, 'eng', {
        logger: m => {
          if(m.status === 'recognizing text') {
            status.innerText = `⏳ 読み取り中... ${Math.round(m.progress * 100)}%`;
          }
        }
      }).then(({ data: { text } }) => {
        status.innerText = '✅ 読み取り完了！修正が必要な場合は直接編集してください。';
        const cleanText = text.replace(/\n+/g, ' ').trim();
        document.getElementById('sentence').value = cleanText;
      }).catch(err => {
        status.innerText = '❌ 読み取りに失敗しました。別の写真でお試しください。';
      });
    }

    function playAudioText(text, rate = 0.9) {
      if (!text) return;
      speechSynthesis.cancel();
      const uttr = new SpeechSynthesisUtterance(text);
      uttr.lang = 'en-US';
      uttr.rate = parseFloat(rate);
      speechSynthesis.speak(uttr);
    }

    function playFullAudio() {
      const text = document.getElementById('sentence').value.trim();
      const rate = document.getElementById('speechRate').value;
      if (!text) return alert('英文を入力してください');
      playAudioText(text, rate);
    }

    function startFullRecognition() {
      const studentId = document.getElementById('studentId').value.trim();
      if (!studentId || studentId.length < 3) {
        alert('生徒ID（4桁）を正しく入力してください。');
        return;
      }

      const originalText = document.getElementById('sentence').value.trim();
      if (!originalText) return alert('英文を入力してください');

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return alert('ブラウザが対応していません (Chrome推奨)');

      activeRecognition = new SpeechRecognition();
      activeRecognition.lang = 'en-US';
      
      document.getElementById('recStatus').innerText = '🎙️ 録音中... 声を出して音読してください。（終わったら「録音終了」を押します）';
      document.getElementById('btnRecStart').disabled = true;
      document.getElementById('btnRecStop').disabled = false;

      activeRecognition.onresult = (event) => {
        resetRecUi();
        const spokenText = event.results[0][0].transcript;
        analyzeSpeech(originalText, spokenText);
      };

      activeRecognition.onerror = (event) => {
        resetRecUi();
        document.getElementById('recStatus').innerText = 'エラーが発生しました: ' + event.error;
      };

      activeRecognition.onend = () => {
        resetRecUi();
      };

      activeRecognition.start();
    }

    function stopFullRecognition() {
      if (activeRecognition) {
        document.getElementById('recStatus').innerText = '⏳ 判定中...';
        activeRecognition.stop();
      }
    }

    function resetRecUi() {
      document.getElementById('btnRecStart').disabled = false;
      document.getElementById('btnRecStop').disabled = true;
    }

    function analyzeSpeech(original, spoken) {
      document.getElementById('recStatus').innerText = '✅ 判定が完了しました！下の「正確さを確認する」をご覧ください。';
      
      const origWords = original.match(/[a-zA-Z0-9']+/g) || [];
      const spokenWords = (spoken.match(/[a-zA-Z0-9']+/g) || []).map(w => w.toLowerCase());

      const wordDisplay = document.getElementById('wordDisplay');
      wordDisplay.innerHTML = '';
      globalWeakWords = [];
      let matchCount = 0;

      let spokenIndex = 0;
      origWords.forEach(word => {
        const cleanWord = word.toLowerCase();
        const foundPos = spokenWords.indexOf(cleanWord, spokenIndex);

        const span = document.createElement('span');
        span.className = 'word ';

        if (foundPos !== -1) {
          span.className += 'word-correct';
          span.innerText = word;
          matchCount++;
          spokenIndex = foundPos + 1;
        } else {
          span.className += 'word-incorrect';
          span.innerText = word;
          if (!globalWeakWords.includes(cleanWord)) {
            globalWeakWords.push(cleanWord);
          }
        }
        wordDisplay.appendChild(span);
      });

      const score = origWords.length > 0 ? Math.round((matchCount / origWords.length) * 100) : 0;
      document.getElementById('scoreVal').innerText = score;
      document.getElementById('resultArea').style.display = 'block';

      renderWeakWords();

      const studentId = document.getElementById('studentId').value.trim();
      const modeName = currentMode === 'teacher' ? '教員課題' : 'オリジナル';
      
      let taskName = '';
      if (currentMode === 'teacher') {
        const select = document.getElementById('taskSelect');
        taskName = select.options[select.selectedIndex]?.text || '課題未選択';
      } else {
        const select = document.getElementById('originalCategorySelect');
        taskName = select.options[select.selectedIndex]?.value || 'オリジナル英作文';
      }

      // データの保存 (API送信)
      fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({
          studentId: studentId,
          mode: modeName,
          taskName: taskName,
          originalText: original,
          spokenText: spoken,
          score: score,
          weakWords: globalWeakWords
        })
      });
    }

    function renderWeakWords() {
      const weakArea = document.getElementById('weakArea');
      const container = document.getElementById('weakWordsList');
      container.innerHTML = '';

      if (globalWeakWords.length === 0) {
        weakArea.style.display = 'none';
        return;
      }

      weakArea.style.display = 'block';
      globalWeakWords.forEach(word => {
        const div = document.createElement('div');
        div.className = 'weak-card';
        div.innerHTML = `
          <strong style="font-size: 18px;">${word}</strong>
          <div>
            <button class="btn-sub" onclick="playAudioText('${word}', 0.7)">🔊 聞く</button>
            <button class="btn-primary" onclick="testSingleWord('${word}', this)">🎙️ テスト</button>
            <span class="test-result" style="margin-left:8px; font-weight:bold;"></span>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function testSingleWord(targetWord, btnElement) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const recognition = new SpeechRecognition();
      recognition.lang = 'en-US';

      const resultSpan = btnElement.nextElementSibling;
      resultSpan.innerText = '聞取り中...';
      resultSpan.style.color = '#64748b';

      recognition.onresult = (event) => {
        const spoken = event.results[0][0].transcript.toLowerCase().trim();
        if (spoken.includes(targetWord.toLowerCase())) {
          resultSpan.innerText = '⭕ PERFECT!';
          resultSpan.style.color = '#166534';
        } else {
          resultSpan.innerText = `❌ (${spoken})`;
          resultSpan.style.color = '#991b1b';
        }
      };

      recognition.onerror = () => { resultSpan.innerText = '❌ エラー'; };
      recognition.start();
    }
  </script>
</body>
</html>
