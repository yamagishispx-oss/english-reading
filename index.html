<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英語音読トレーニング - 伝わる英語を目指そう</title>
  <!-- OCR用の外部ライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bg-main: #f8fafc;
      --surface: #ffffff;
      --text-main: #0f172a;
      --text-sub: #475569;
      --border-color: #e2e8f0;
      
      --color-perfect: #16a34a;
      --bg-perfect: #dcfce7;
      --color-again: #dc2626;
      --bg-again: #fee2e2;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 20px 16px;
      max-width: 760px;
      margin: 0 auto;
      color: var(--text-main);
      background: var(--bg-main);
      line-height: 1.5;
    }
    .header-card {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #1e3a8a 100%);
      color: #ffffff;
      padding: 22px 20px;
      border-radius: 14px;
      margin-bottom: 18px;
      text-align: center;
      box-shadow: 0 8px 20px -4px rgba(15, 23, 42, 0.2);
    }
    .header-card h1 { margin: 0; font-size: 1.5rem; font-weight: 800; }
    .header-card .sub-message { font-size: 0.92rem; font-weight: 600; margin-top: 8px; color: #38bdf8; }
    .card { background: var(--surface); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 2px 8px rgba(0,0,0,0.03); margin-bottom: 16px; }
    h2 { margin-top: 0; font-size: 1.02rem; font-weight: 700; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #f1f5f9; padding-bottom: 8px; margin-bottom: 14px; }
    .grid-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    @media (max-width: 600px) { .grid-2col { grid-template-columns: 1fr; } }
    .script-box { padding: 14px; border-radius: 10px; border: 1px solid var(--border-color); background: #ffffff; transition: all 0.2s ease; }
    .script-box.active { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15); background: #f0f9ff; }
    .script-box-title { font-weight: 700; font-size: 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
    label { font-weight: 600; font-size: 13px; color: var(--text-sub); }
    input[type="text"], textarea, select { width: 100%; padding: 9px; font-size: 14px; box-sizing: border-box; border: 1px solid var(--border-color); border-radius: 8px; margin-top: 4px; }
    textarea { height: 95px; font-family: inherit; resize: vertical; }
    button { padding: 9px 15px; font-size: 13.5px; border: none; border-radius: 7px; cursor: pointer; font-weight: 700; margin-right: 6px; margin-top: 6px; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: #ffffff; }
    .btn-success { background: #16a34a; color: #ffffff; }
    .btn-danger { background: #dc2626; color: #ffffff; }
    .btn-sub { background: #64748b; color: #ffffff; }
    .btn-auto-chunk { background: #f1f5f9; color: var(--primary-dark); border: 1px solid #cbd5e1; padding: 4px 10px; font-size: 12px; border-radius: 6px; }
    .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 16px; }
    .metric-card { background: #f8fafc; border: 1px solid #e2e8f0; padding: 12px; border-radius: 8px; text-align: center; }
    .metric-label { font-size: 11.5px; font-weight: 700; color: var(--text-sub); }
    .metric-value { font-size: 24px; font-weight: 800; color: var(--primary); margin-top: 2px; }
    .metric-unit { font-size: 12px; font-weight: 600; color: #64748b; }
    .wpm-badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 12px; margin-top: 4px; }
    .badge-target { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
    .badge-slow { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; }
    .badge-fast { background: #e0f2fe; color: #0369a1; border: 1px solid #7dd3fc; }
    
    .word { display: inline-block; padding: 3px 8px; margin: 3px; border-radius: 5px; font-size: 16.5px; font-weight: 700; }
    .word-perfect { background: var(--bg-perfect); color: var(--color-perfect); border: 1px solid #bbf7d0; }
    .word-again { background: var(--bg-again); color: var(--color-again); border: 1px solid #fecdd3; }
    .chunk-divider { color: #0284c7; font-weight: 800; margin: 0 4px; font-size: 18px; }
    .legend { display: flex; gap: 12px; font-size: 11.5px; font-weight: 600; margin-bottom: 10px; }
    .legend-item { display: flex; align-items: center; gap: 4px; }
    .legend-dot { width: 9px; height: 9px; border-radius: 50%; }
    .wpm-info-box { background: #eff6ff; border: 1px dashed #93c5fd; border-radius: 8px; padding: 8px 12px; font-size: 12px; color: #1e40af; margin-bottom: 14px; }
    
    #visualizer {
      width: 100%;
      height: 50px;
      background: #0f172a;
      border-radius: 8px;
      margin-top: 10px;
      display: none;
    }

    .self-audio-box {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .self-audio-title {
      font-size: 13px;
      font-weight: 700;
      color: #166534;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .weak-practice-box {
      background: #fff1f2;
      border: 1px solid #fecdd3;
      border-radius: 10px;
      padding: 14px;
      margin-top: 16px;
    }
    .weak-practice-title {
      font-weight: 700;
      font-size: 14px;
      color: #991b1b;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .weak-word-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ffffff;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #fda4af;
      margin-bottom: 8px;
      flex-wrap: wrap;
      gap: 6px;
    }
    .weak-word-info {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .weak-word-text {
      font-weight: 800;
      font-size: 16px;
      color: #dc2626;
    }
    .phonetic-text {
      font-size: 13px;
      color: #0284c7;
      font-family: monospace;
      font-weight: 600;
      background: #e0f2fe;
      padding: 1px 6px;
      border-radius: 4px;
    }
    .weak-word-actions {
      display: flex;
      gap: 6px;
    }
    .btn-mini {
      padding: 4px 10px;
      font-size: 12px;
      margin: 0;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="header-card">
    <h1>英語音読トレーニング</h1>
    <div class="sub-message">〜 相手に「伝わる英語」と「適正スピード」を目指そう！ 〜</div>
  </div>
  <div class="card" style="background: #f0f9ff; border-color: #bae6fd;">
    <label for="studentId">生徒ID（半角4桁／入力必須）</label>
    <input type="text" id="studentId" placeholder="例: 1459" maxlength="4" oninput="saveStudentId()">
  </div>
  <div class="card">
    <h2>
      <span>原稿の準備</span>
      <button class="btn-auto-chunk" onclick="applyAutoChunking()">🪄 自動チャンク区切り</button>
    </h2>
    <div class="grid-2col">
      <!-- 左：オリジナル原稿 -->
      <div class="script-box" id="boxOriginal">
        <div class="script-box-title">
          <input type="radio" id="modeRadioOriginal" name="modeRadio" value="original" onchange="setScriptMode('original')">
          <label for="modeRadioOriginal" style="cursor: pointer;">① オリジナル原稿を使う</label>
        </div>
        <div style="margin-bottom: 8px;">
          <label>授業名・単元名:</label>
          <select id="originalCategorySelect">
            <option value="">データ読み込み中...</option>
          </select>
        </div>
        <div>
          <label>画像から文字読み込み (OCR):</label>
          <input type="file" id="imageInput" accept="image/*" onchange="processImage(this)" style="margin-top:4px; font-size:12px;">
          <div id="ocrStatus" style="font-weight:600; color:var(--primary); font-size:12.5px; margin-top:4px;"></div>
        </div>
      </div>
      <!-- 右：配信課題 -->
      <div class="script-box active" id="boxTeacher">
        <div class="script-box-title">
          <input type="radio" id="modeRadioTeacher" name="modeRadio" value="teacher" checked onchange="setScriptMode('teacher')">
          <label for="modeRadioTeacher" style="cursor: pointer;">② 配信課題を使う</label>
        </div>
        <div>
          <label>課題を選択:</label>
          <select id="taskSelect" onchange="onTaskChange()">
            <option value="">データ読み込み中...</option>
          </select>
        </div>
      </div>
    </div>
    <div>
      <label>英文の確認・編集（ / で区切り位置を指定可能）:</label>
      <textarea id="sentence" placeholder="選択された英文または入力した英文がここに表示されます..."></textarea>
    </div>
  </div>
  
  <div class="grid-2col">
    <div class="card" style="margin-bottom: 0;">
      <h2>音声再生（お手本）</h2>
      <div style="margin-bottom: 8px;">
        <label>速度: </label>
        <select id="speechRate" style="width: auto; display: inline-block; padding: 4px 8px;" onchange="stopAudio()">
          <option value="0.7">ゆっくり (0.7x)</option>
          <option value="0.9" selected>標準 (0.9x / 約110 WPM)</option>
          <option value="1.1">速め (1.1x / 約130 WPM)</option>
        </select>
      </div>
      <div>
        <button class="btn-primary" id="btnAudioPlay" onclick="playFullAudio()">再生</button>
        <button class="btn-sub" id="btnAudioStop" onclick="stopAudio()" disabled>停止</button>
      </div>
    </div>
    <div class="card" style="margin-bottom: 0;">
      <h2>音読録音</h2>
      <div>
        <button class="btn-success" id="btnRecStart" onclick="startFullRecognition()">録音開始</button>
        <button class="btn-danger" id="btnRecStop" onclick="stopFullRecognition()" disabled>録音終了</button>
      </div>
      <canvas id="visualizer"></canvas>
    </div>
  </div>
  
  <div class="card" id="resultArea" style="display:none; margin-top: 16px;">
    <h2>評価結果分析</h2>
    
    <div class="self-audio-box" id="selfAudioContainer" style="display: none;">
      <div class="self-audio-title">🎙️ 自分の録音を聞いてセルフチェック</div>
      <audio id="selfAudioPlayer" controls style="height: 36px; max-width: 300px;"></audio>
    </div>

    <div class="wpm-info-box">
      ⚡ <strong>WPM（Words Per Minute）とは？</strong><br>
      1分間に読める単語数を示します。高校生の目標スピードは <strong>100〜130 WPM</strong> です。速読力とリスニング力に直結します！
    </div>
    <div id="resultContent" class="metrics-grid"></div>
    <div id="chunkResultArea" style="margin-top: 16px;"></div>
    <div id="weakWordsPracticeArea"></div>
  </div>

  <script>
    // ==========================================
    // ① 全体設定とデータ読み込み
    // ==========================================
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxIX_Yqm2Qsb2EPnYpSwXXn_3fRiyVCBUCS0wPkbeGS_nuDM4ojKYGeKuw99RDEk9Xc/exec";
    let currentMode = 'teacher';

    // ページのロード完了を安全に待機して実行
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", loadInitialData);
    } else {
      loadInitialData();
    }

    async function loadInitialData() {
      const savedId = localStorage.getItem("studentId");
      if(savedId && document.getElementById("studentId")) {
        document.getElementById("studentId").value = savedId;
      }
      const taskSelect = document.getElementById("taskSelect");
      const categorySelect = document.getElementById("originalCategorySelect");

      try {
        const response = await fetch(GAS_WEB_APP_URL);
        if (!response.ok) throw new Error("HTTP ステータスエラー: " + response.status);
        const data = await response.json();

        if (taskSelect && data.teacherTasks) {
          taskSelect.innerHTML = '<option value="">課題を選択してください</option>';
          data.teacherTasks.forEach(task => {
            const opt = document.createElement("option");
            opt.value = task.text; 
            opt.textContent = task.title;
            taskSelect.appendChild(opt);
          });
        }

        if (categorySelect && data.originalCategories) {
          categorySelect.innerHTML = '<option value="">カテゴリを選択してください</option>';
          data.originalCategories.forEach(category => {
            const opt = document.createElement("option");
            opt.value = category; 
            opt.textContent = category;
            categorySelect.appendChild(opt);
          });
        }
      } catch(error) {
        console.error("データ読み込みエラー:", error);
        if (taskSelect) taskSelect.innerHTML = '<option value="">(課題を手入力または選択できます)</option>';
        if (categorySelect) categorySelect.innerHTML = '<option value="">(カテゴリを選択)</option>';
      }
    }

    function saveStudentId() {
      localStorage.setItem("studentId", document.getElementById("studentId").value);
    }
    function setScriptMode(mode) {
      currentMode = mode;
      document.getElementById('boxOriginal').classList.toggle('active', mode === 'original');
      document.getElementById('boxTeacher').classList.toggle('active', mode === 'teacher');
    }
    function onTaskChange() {
      if(currentMode === 'teacher') {
        document.getElementById('sentence').value = document.getElementById('taskSelect').value;
      }
    }

    // ==========================================
    // ② 自動チャンク区切り ＆ OCR
    // ==========================================
    function applyAutoChunking() {
      let text = document.getElementById('sentence').value;
      if (!text) return alert("英文が入力されていません。");
      text = text.replace(/\s*\/\s*/g, ' ');
      text = text.replace(/([,;:?!.])\s+/g, '$1 / ');
      const keywords = [
        "in", "on", "at", "to", "for", "with", "by", "from", "of", "about", "into", "through", "during", "before", "after",
        "because", "when", "if", "and", "but", "or", "so", "which", "who", "that", "where", "while", "although"
      ];
      keywords.forEach(function(kw) {
        const regex = new RegExp("\\s+(" + kw + ")\\s+", "gi");
        text = text.replace(regex, " / $1 ");
      });
      text = text.replace(/\/\s*\//g, '/').replace(/\s+/g, ' ').replace(/\s*\/\s*/g, ' / ').trim();
      document.getElementById('sentence').value = text;
    }

    async function processImage(input) {
      if (!input.files || input.files.length === 0) return;
      document.getElementById('modeRadioOriginal').checked = true;
      setScriptMode('original');
      const status = document.getElementById('ocrStatus');
      status.innerText = "⏳ 画像読み取り中...少々お待ちください";
      try {
        const result = await Tesseract.recognize(input.files[0], 'eng');
        document.getElementById('sentence').value = result.data.text.replace(/\n/g, ' ');
        status.innerText = "✅ 読み取り完了！";
      } catch(err) {
        status.innerText = "❌ エラーが発生しました";
      }
    }

    // ==========================================
    // ③ 音声再生（お手本） API
    // ==========================================
    let synth = window.speechSynthesis;
    function playFullAudio() {
      stopAudio();
      let text = document.getElementById('sentence').value.replace(/\//g, '');
      if(!text) return alert("英文を入力してください");
      let utterThis = new SpeechSynthesisUtterance(text);
      utterThis.lang = 'en-US';
      utterThis.rate = parseFloat(document.getElementById('speechRate').value);
      utterThis.onend = () => document.getElementById('btnAudioStop').disabled = true;
      document.getElementById('btnAudioStop').disabled = false;
      synth.speak(utterThis);
    }
    function stopAudio() {
      if(synth) synth.cancel();
      document.getElementById('btnAudioStop').disabled = true;
    }
    function playSingleWord(word) {
      if(synth) synth.cancel();
      let utterThis = new SpeechSynthesisUtterance(word);
      utterThis.lang = 'en-US';
      utterThis.rate = 0.8;
      synth.speak(utterThis);
    }

    // ==========================================
    // ④ 音声認識 ＆ 音声録音（MediaRecorder） ＆ 波形ビジュアル
    // ==========================================
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = SpeechRecognition ? new SpeechRecognition() : null;
    let startTime = 0;
    let accumulatedText = "";
    let accumulatedConfidence = [];
    let isRecording = false;

    let mediaRecorder = null;
    let audioChunks = [];
    let audioCtx = null;
    let analyser = null;
    let animFrameId = null;
    let micStream = null;

    if(recognition) {
      recognition.lang = 'en-US';
      recognition.continuous = true;
      recognition.interimResults = false;
      recognition.onresult = function(event) {
        accumulatedText = "";
        accumulatedConfidence = [];
        for (let i = 0; i < event.results.length; i++) {
          accumulatedText += event.results[i][0].transcript + " ";
          if (event.results[i][0].confidence) {
            accumulatedConfidence.push(event.results[i][0].confidence);
          }
        }
      };
      recognition.onerror = function(event) {
        console.error("音声認識エラー:", event.error);
        if(event.error === 'not-allowed') {
          alert("マイクの使用が許可されていません。ブラウザのマイク設定をご確認ください。");
        }
      };
      recognition.onend = function() {
        if (!isRecording) return;
        stopMediaRecorderAndVisualizer();
        isRecording = false;
        
        let durationMin = (Date.now() - startTime) / 1000 / 60;
        let avgConfidence = 0.85;
        if (accumulatedConfidence.length > 0) {
          avgConfidence = accumulatedConfidence.reduce((a, b) => a + b, 0) / accumulatedConfidence.length;
        }
        if (!accumulatedText.trim()) {
          alert("音声が認識できませんでした。マイクの許可を確認し、もう一度はっきりと発音してください。");
          return;
        }
        analyzeAndSend(accumulatedText.trim(), Math.max(durationMin, 0.01), avgConfidence);
      };
    }

    function startVisualizer(stream) {
      const canvas = document.getElementById('visualizer');
      if (!canvas) return;
      canvas.style.display = 'block';
      const canvasCtx = canvas.getContext('2d');

      const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtxClass) return;
      audioCtx = new AudioCtxClass();
      analyser = audioCtx.createAnalyser();
      const source = audioCtx.createMediaStreamSource(stream);
      source.connect(analyser);

      analyser.fftSize = 256;
      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);

      function draw() {
        animFrameId = requestAnimationFrame(draw);
        analyser.getByteFrequencyData(dataArray);

        canvasCtx.fillStyle = '#0f172a';
        canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

        const barWidth = (canvas.width / bufferLength) * 2.5;
        let x = 0;

        for (let i = 0; i < bufferLength; i++) {
          const barHeight = (dataArray[i] / 255) * canvas.height;
          canvasCtx.fillStyle = '#38bdf8';
          canvasCtx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
          x += barWidth + 1;
        }
      }
      draw();
    }

    function stopMediaRecorderAndVisualizer() {
      if (animFrameId) cancelAnimationFrame(animFrameId);
      const canvas = document.getElementById('visualizer');
      if (canvas) canvas.style.display = 'none';

      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
      if (micStream) {
        micStream.getTracks().forEach(track => track.stop());
      }
      if (audioCtx && audioCtx.state !== 'closed') {
        audioCtx.close();
      }
    }

    async function startFullRecognition() {
      if(!document.getElementById('sentence').value) return alert("英文を入力してください。");
      const sid = document.getElementById('studentId').value;
      if(sid.length !== 4) return alert("生徒IDを半角数字4桁で入力してください。");
      
      document.getElementById('resultArea').style.display = 'none';
      document.getElementById('selfAudioContainer').style.display = 'none';
      document.getElementById('btnRecStart').disabled = true;
      document.getElementById('btnRecStop').disabled = false;
      
      accumulatedText = "";
      accumulatedConfidence = [];
      audioChunks = [];
      isRecording = true;
      startTime = Date.now();

      try {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        startVisualizer(micStream);

        if (window.MediaRecorder) {
          mediaRecorder = new MediaRecorder(micStream);
          mediaRecorder.ondataavailable = e => {
            if (e.data.size > 0) audioChunks.push(e.data);
          };
          mediaRecorder.onstop = () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            const audioUrl = URL.createObjectURL(audioBlob);
            const player = document.getElementById('selfAudioPlayer');
            player.src = audioUrl;
            document.getElementById('selfAudioContainer').style.display = 'flex';
          };
          mediaRecorder.start();
        }

        if (recognition) recognition.start();
      } catch(e) {
        console.error("マイクアクセスエラー:", e);
        alert("マイクの許可が得られませんでした。");
        document.getElementById('btnRecStart').disabled = false;
        document.getElementById('btnRecStop').disabled = true;
      }
    }

    function stopFullRecognition() {
      document.getElementById('btnRecStart').disabled = false;
      document.getElementById('btnRecStop').disabled = true;
      if(recognition && isRecording) {
        recognition.stop();
      }
    }

    // ==========================================
    // ⑤ 評価分析と結果送信
    // ==========================================
    function analyzeAndSend(spokenText, durationMin, confidence) {
      const originalText = document.getElementById('sentence').value;
      const cleanOriginal = originalText.replace(/\//g, '').replace(/[.,?!]/g, '').toLowerCase().split(/\s+/).filter(w=>w);
      const cleanSpoken = spokenText.replace(/[.,?!]/g, '').toLowerCase().split(/\s+/).filter(w=>w);
