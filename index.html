<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英語音読トレーニング - 伝わる英語を目指そう</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bg-main: #f8fafc;
      --surface: #ffffff;
      --text-main: #0f172a;
      --text-sub: #475569;
      --border-color: #e2e8f0;
      
      --color-perfect: #16a34a;
      --bg-perfect: #dcfce7;
      --color-near: #d97706;
      --bg-near: #fef3c7;
      --color-again: #dc2626;
      --bg-again: #fee2e2;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 20px 16px;
      max-width: 760px;
      margin: 0 auto;
      color: var(--text-main);
      background: var(--bg-main);
      line-height: 1.5;
    }
    .header-card {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #1e3a8a 100%);
      color: #ffffff;
      padding: 22px 20px;
      border-radius: 14px;
      margin-bottom: 18px;
      text-align: center;
      box-shadow: 0 8px 20px -4px rgba(15, 23, 42, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .header-card h1 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.03em;
    }
    .header-card .sub-message {
      font-size: 0.92rem;
      font-weight: 600;
      margin-top: 8px;
      color: #38bdf8;
      letter-spacing: 0.02em;
    }
    .card {
      background: var(--surface);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      margin-bottom: 16px;
    }
    h2 {
      margin-top: 0;
      color: var(--text-main);
      font-size: 1.02rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 8px;
      margin-bottom: 14px;
    }
    .grid-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }
    @media (max-width: 600px) {
      .grid-2col {
        grid-template-columns: 1fr;
      }
    }
    .script-box {
      padding: 14px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: #ffffff;
      transition: all 0.2s ease;
    }
    .script-box.active {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
      background: #f0f9ff;
    }
    .script-box-title {
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    label { font-weight: 600; font-size: 13px; color: var(--text-sub); }
    input[type="text"], textarea, select {
      width: 100%;
      padding: 9px;
      font-size: 14px;
      box-sizing: border-box;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      margin-top: 4px;
      background: #ffffff;
      color: var(--text-main);
    }
    textarea { height: 95px; font-family: inherit; resize: vertical; }
    button {
      padding: 9px 15px;
      font-size: 13.5px;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      font-weight: 700;
      margin-right: 6px;
      margin-top: 6px;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: #ffffff; }
    .btn-success { background: #16a34a; color: #ffffff; }
    .btn-danger { background: #dc2626; color: #ffffff; }
    .btn-sub { background: #64748b; color: #ffffff; }
    .btn-auto-chunk {
      background: #f1f5f9;
      color: var(--primary-dark);
      border: 1px solid #cbd5e1;
      padding: 4px 10px;
      font-size: 12px;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-auto-chunk:hover { background: #e2e8f0; }
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }
    .metric-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
    }
    .metric-label { font-size: 11.5px; font-weight: 700; color: var(--text-sub); }
    .metric-value { font-size: 24px; font-weight: 800; color: var(--primary); margin-top: 2px; }
    .metric-unit { font-size: 12px; font-weight: 600; color: #64748b; }
    .metric-desc { font-size: 11px; font-weight: 600; color: #0284c7; margin-top: 2px; }
    .wpm-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 12px;
      margin-top: 4px;
    }
    .badge-target { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
    .badge-slow { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; }
    .badge-fast { background: #e0f2fe; color: #0369a1; border: 1px solid #7dd3fc; }
    .word {
      display: inline-block;
      padding: 3px 8px;
      margin: 3px;
      border-radius: 5px;
      font-size: 16.5px;
      font-weight: 700;
    }
    .word-perfect { background: var(--bg-perfect); color: var(--color-perfect); border: 1px solid #bbf7d0; }
    .word-near { background: var(--bg-near); color: var(--color-near); border: 1px solid #fde68a; }
    .word-again { background: var(--bg-again); color: var(--color-again); border: 1px solid #fecdd3; }
    .chunk-divider { color: #0284c7; font-weight: 800; margin: 0 4px; font-size: 18px; }
    .weak-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff1f2;
      border: 1px solid #fecdd3;
      padding: 10px 14px;
      border-radius: 8px;
      margin-top: 8px;
    }
    #ocrStatus { font-weight: 600; color: var(--primary); margin-top: 6px; font-size: 12.5px; }
    .legend { display: flex; gap: 12px; font-size: 11.5px; font-weight: 600; margin-bottom: 10px; }
    .legend-item { display: flex; align-items: center; gap: 4px; }
    .legend-dot { width: 9px; height: 9px; border-radius: 50%; }
    .wpm-info-box {
      background: #eff6ff;
      border: 1px dashed #93c5fd;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      color: #1e40af;
      margin-bottom: 14px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header-card">
    <h1>英語音読トレーニング</h1>
    <div class="sub-message">〜 相手に「伝わる英語」と「適正スピード」を目指そう！ 〜</div>
  </div>

  <div class="card" style="background: #f0f9ff; border-color: #bae6fd;">
    <label for="studentId">生徒ID（半角4桁／入力必須）</label>
    <input type="text" id="studentId" placeholder="例: 1459" maxlength="4" oninput="saveStudentId()">
  </div>

  <div class="card">
    <h2>
      <span>原稿の準備</span>
      <button class="btn-auto-chunk" onclick="applyAutoChunking()">🪄 自動チャンク区切り</button>
    </h2>

    <div class="grid-2col">
      <!-- 左：オリジナル原稿 -->
      <div class="script-box" id="boxOriginal">
        <div class="script-box-title">
          <input type="radio" id="modeRadioOriginal" name="modeRadio" value="original" onchange="setScriptMode('original')">
          <label for="modeRadioOriginal" style="color: var(--text-main); font-size: 14px; cursor: pointer;">① オリジナル原稿を使う</label>
        </div>
        <div style="margin-bottom: 8px;">
          <label>授業名・単元名:</label>
          <select id="originalCategorySelect" onchange="onCategoryChange()">
            <option value="">データ読み込み中...</option>
          </select>
        </div>
        <div>
          <label>画像から文字読み込み (OCR):</label>
          <input type="file" id="imageInput" accept="image/*" onchange="processImage(this)" style="margin-top:4px; font-size:12px;">
          <div id="ocrStatus"></div>
        </div>
      </div>

      <!-- 右：配信課題 -->
      <div class="script-box active" id="boxTeacher">
        <div class="script-box-title">
          <input type="radio" id="modeRadioTeacher" name="modeRadio" value="teacher" checked onchange="setScriptMode('teacher')">
          <label for="modeRadioTeacher" style="color: var(--text-main); font-size: 14px; cursor: pointer;">② 配信課題を使う</label>
        </div>
        <div>
          <label>課題を選択:</label>
          <select id="taskSelect" onchange="onTaskChange()">
            <option value="">データ読み込み中...</option>
          </select>
        </div>
      </div>
    </div>

    <div>
      <label>英文の確認・編集（ / で区切り位置を指定可能）:</label>
      <textarea id="sentence" placeholder="選択された英文または入力した英文がここに表示されます..."></textarea>
    </div>
  </div>

  <div class="grid-2col">
    <div class="card" style="margin-bottom: 0;">
      <h2>音声再生（お手本）</h2>
      <div style="margin-bottom: 8px;">
        <label>速度: </label>
        <select id="speechRate" style="width: auto; display: inline-block; padding: 4px 8px;" onchange="stopAudio()">
          <option value="0.7">ゆっくり (0.7x)</option>
          <option value="0.9" selected>標準 (0.9x / 約110 WPM)</option>
          <option value="1.1">速め (1.1x / 約130 WPM)</option>
        </select>
      </div>
      <div>
        <button class="btn-primary" id="btnAudioPlay" onclick="playFullAudio()">再生</button>
        <button class="btn-sub" id="btnAudioStop" onclick="stopAudio()" disabled>停止</button>
      </div>
    </div>

    <div class="card" style="margin-bottom: 0;">
      <h2>音読録音</h2>
      <div>
        <button class="btn-success" id="btnRecStart" onclick="startFullRecognition()">録音開始</button>
        <button class="btn-danger" id="btnRecStop" onclick="stopFullRecognition()" disabled>録音終了</button>
      </div>
      <p id="recStatus" style="color: var(--text-sub); font-size: 12.5px; margin-top: 8px; min-height: 18px; line-height: 1.3;"></p>
    </div>
  </div>

  <div class="card" id="resultArea" style="display:none; margin-top: 16px;">
    <h2>評価結果分析</h2>
    
    <div class="wpm-info-box">
      ⚡ <strong>WPM（Words Per Minute）とは？</strong><br>
      1分間に読める単語数を示します。高校生の目標スピードは <strong>100〜130 WPM</strong> です。速読力とリスニング力にそのまま直結します！
    </div>

    <div class="metrics-grid">
      <div class="
